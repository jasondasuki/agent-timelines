[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-timelines"
version = "0.1.0"
description = "Live delegation graph of Claude Code sessions and their subagents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jasondasuki" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["claude-code", "claude", "agents", "subagents", "dashboard", "observability", "pixel-art"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/jasondasuki/agent-timelines"
Issues = "https://github.com/jasondasuki/agent-timelines/issues"

[project.scripts]
agent-timelines = "agent_timelines.cli:main"

[tool.setuptools.package-data]
agent_timelines = ["viewer.html", "*.js", "assets/*"]
