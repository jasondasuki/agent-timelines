name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Python tests
        env:
          AGENT_TIMELINES_CONFIG: /nonexistent
        run: python tests/test_timeline.py && python tests/test_cli.py
      - name: Viewer tests
        run: node tests/test_dungeon.js && node tests/test_actors.js && node tests/test_lobby.js && node tests/test_gantt.js && node tests/test_trophy.js
      - name: Clean install
        run: |
          python -m pip install --quiet .
          agent-timelines --help
          python -c "import agent_timelines, os; d = os.path.dirname(agent_timelines.__file__); assert all(os.path.exists(os.path.join(d, f)) for f in ('viewer.html', 'dungeon.js', 'actors.js', 'lobby.js', 'gantt.js', 'trophy.js', 'assets/tiny-dungeon.png'))"
      - name: Build and check the package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pip install build twine && python -m build && twine check --strict dist/*
